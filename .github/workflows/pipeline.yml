name: Backend EDC Pinpad Gateway

# 1. Kapan proses ini berjalan?
on:
  push:
    branches:
      - master # Jalan setiap ada push ke branch main

jobs:
  # 2. Tugas pertama: Test kode Golang
  test-kode:
    runs-on: ubuntu-latest # Menggunakan server virtual Ubuntu dari GitHub

    # --- 1. Service MySQL ---
    services:
      mysql_db:
        image: mysql:8.0 # Versi MySQL, sesuaikan jika kamu pakai versi 5.7
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: namadb_test
          MYSQL_USER: user_test
          MYSQL_PASSWORD: password_test
        ports:
          - 3306:3306
        # Menunggu MySQL benar-benar siap menerima koneksi sebelum lanjut
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v5 # Mengambil kodenya dari repository

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25' # Setup Golang di server virtual

      - name: Generate .env file
        run: |
          echo "STANDALONE_MODE=true" >> .env
          echo "LISTEN_PORT=9888" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_USER=user_test" >> .env
          echo "DB_PASS=password_test" >> .env
          echo "DB_NAME=namadb_test" >> .env

      - name: Jalankan Unit Test

        run: go test -v ./... # Perintah standar untuk test Golang

  # --- TAMBAHAN BARU UNTUK CD ---
  build-docker:
    needs: test-kode # WAJIB: Job ini hanya jalan kalau 'test-kode' sukses
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v5
        
      # Ini akan melakukan simulasi build Docker image di server GitHub
      - name: Build Docker Image
        run: docker build -t backend-app:latest .