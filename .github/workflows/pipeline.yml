name: Backend EDC Pinpad Gateway

# 1. Kapan proses ini berjalan?
on:
  push:
    branches:
      - master # Jalan setiap ada push ke branch main

jobs:
  # 2. Tugas pertama: Test kode Golang
  test-kode:
    runs-on: ubuntu-latest # Menggunakan server virtual Ubuntu dari GitHub
    
    steps:
      - name: Checkout Kode
        uses: actions/checkout@v5 # Mengambil kodenya dari repository

      - name: Setup Golang
        uses: actions/setup-go@v6
        with:
          go-version: '1.25' # Setup Golang di server virtual

      - name: Generate .env file
        run: |
          echo "STANDALONE_MODE=true" >> .env
          echo "LISTEN_PORT=9888" >> .env
          echo "DB_HOST=gateway01.ap-southeast-1.prod.aws.tidbcloud.com" >> .env
          echo "DB_PORT=4000" >> .env
          echo "DB_USER=48aKUawB3PKNtJQ.root" >> .env
          echo "DB_PASS=30PyUCl81PQYl9Bz" >> .env
          echo "DB_NAME=sys" >> .env

      - name: Jalankan Unit Test

        run: go test -v ./... # Perintah standar untuk test Golang

  # 2. CD: Suruh Render melakukan deploy JIKA test sukses
  deploy-ke-render:
    needs: test-kode # Wajib menunggu test-kode sukses/hijau
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        # Mengirim sinyal ke Render untuk mulai build dan deploy
        run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}